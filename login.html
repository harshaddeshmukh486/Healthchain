<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HealthChain — Login</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet"/>
  <!-- Tailwind CSS Stylesheet -->
  <link rel="stylesheet" href="/src/css/style.css" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Global Error Handler -->
  <script type="module" src="/src/js/error-handler.js"></script>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').then(registration => {
          console.log('SW registered: ', registration.scope);
        }).catch(registrationError => {
          console.log('SW registration failed: ', registrationError);
        });
      });
    }
  </script>
</head>
<body class="bg-bg text-white font-body min-h-screen flex flex-col justify-center items-center px-4 py-8">

  <!-- Global Loader -->
  <div id="global-loader" class="fixed inset-0 bg-bg z-50 flex flex-col items-center justify-center transition-opacity duration-300">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-accent/20 border-t-accent shadow-md"></div>
    <p id="loader-text" class="mt-5 text-white/50 font-semibold tracking-wide text-sm animate-pulse">Verifying session...</p>
  </div>

  <main class="w-full max-w-[420px] flex flex-col items-center">
    <!-- Header -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2.5 font-heading font-extrabold text-3xl mb-1 text-white">
        Health<span class="text-transparent bg-clip-text bg-gradient-to-r from-accent to-accent-2">Chain</span>
      </a>
      <p class="text-xs text-white/40 font-medium tracking-wide">Secure your medical records</p>
    </div>

    <!-- Role Selection Card Group -->
    <div class="grid grid-cols-2 gap-4 w-full mb-6" role="radiogroup" aria-label="Select your role">
      <!-- Patient Role Card -->
      <div id="patient-card" class="bg-surface border-2 border-border rounded-2xl p-4 text-center cursor-pointer transition-all duration-300 hover:border-accent/40 select-none relative focus-visible:outline-none focus-visible:border-accent" tabindex="0" role="radio" aria-checked="true">
        <div class="selected-badge absolute top-3 right-3 bg-accent text-bg rounded-full w-5 h-5 flex items-center justify-center text-[10px] font-bold transition-opacity duration-200">✓</div>
        <span class="text-3xl mb-2 block">👤</span>
        <div class="font-heading font-bold text-sm text-white">Patient</div>
      </div>
      
      <!-- Doctor Role Card -->
      <div id="doctor-card" class="bg-surface border-2 border-border rounded-2xl p-4 text-center cursor-pointer transition-all duration-300 hover:border-accent/40 select-none relative focus-visible:outline-none focus-visible:border-accent" tabindex="0" role="radio" aria-checked="false">
        <div class="selected-badge absolute top-3 right-3 bg-accent text-bg rounded-full w-5 h-5 flex items-center justify-center text-[10px] font-bold transition-opacity duration-200 opacity-0">✓</div>
        <span class="text-3xl mb-2 block">👨‍⚕️</span>
        <div class="font-heading font-bold text-sm text-white">Doctor</div>
      </div>
    </div>

    <!-- Login Box -->
    <div class="glass-panel w-full rounded-2xl p-7 shadow-2xl relative">
      <h3 id="login-title" class="font-heading font-bold text-lg mb-5 text-white/70">Login as a Patient</h3>
      
      <!-- Google Auth Button -->
      <button class="w-full bg-white hover:bg-neutral-100 text-bg py-3 px-4 rounded-xl font-bold text-sm transition-all duration-200 flex items-center justify-center gap-3 cursor-pointer shadow-sm" id="googleBtn" type="button">
        <img src="https://www.google.com/favicon.ico" class="w-4.5 h-4.5" alt="Google icon"> Continue with Google
      </button>

      <div class="flex items-center my-5 text-white/30 text-[10px] uppercase tracking-wider font-bold before:content-[''] before:flex-1 before:border-b before:border-border/60 before:mr-3 after:content-[''] after:flex-1 after:border-b after:border-border/60 after:ml-3">
        or login with email
      </div>

      <!-- Auth Form -->
      <form id="authForm" class="flex flex-col gap-4" novalidate>
        <!-- Email Input -->
        <div class="relative">
          <input type="email" id="email" class="w-full bg-surface-2 border border-border focus:border-accent focus:ring-1 focus:ring-accent rounded-xl py-3 px-4 text-sm text-white outline-none transition-all placeholder:text-white/30" placeholder="Email Address" autocomplete="email" required>
        </div>
        
        <!-- Password Input -->
        <div class="relative">
          <input type="password" id="password" class="w-full bg-surface-2 border border-border focus:border-accent focus:ring-1 focus:ring-accent rounded-xl py-3 px-12 pr-12 text-sm text-white outline-none transition-all placeholder:text-white/30" placeholder="Password (min 6 chars)" autocomplete="current-password" required minlength="6">
          <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 bg-transparent border-none text-white/40 hover:text-accent cursor-pointer text-sm outline-none" id="passwordToggle" aria-label="Show password">👁</button>
        </div>
        
        <!-- Forgot Password -->
        <a href="#" id="forgotLink" class="text-right text-xs text-white/50 hover:text-accent font-medium transition-colors self-end -mt-1">
          Forgot password?
        </a>
        
        <!-- Submission Buttons -->
        <button id="loginBtn" class="w-full py-3.5 bg-gradient-to-r from-accent to-accent-2 text-white font-bold text-sm rounded-xl cursor-pointer transition-all duration-300 hover:shadow-lg hover:shadow-accent/25" type="submit">
          Login
        </button>
        <button id="signupBtn" class="w-full py-3.5 bg-transparent border border-accent-2/60 hover:bg-accent-2/10 text-white/80 font-bold text-sm rounded-xl cursor-pointer transition-all duration-200" type="button">
          Create Account
        </button>
      </form>
      
      <p class="text-center text-[10px] text-white/30 leading-relaxed mt-6">
        By continuing, you agree to our care for your data. 🔒
      </p>
    </div>
  </main>

  <script type="module" src="/src/js/login.js"></script>
</body>
</html>
